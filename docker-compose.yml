services:
  nginx:
    image: nginx:alpine
    container_name: prediction_nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html:z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: prediction_app
    volumes:
      - ./src:/var/www/html:z
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: prediction_db
    environment:
      POSTGRES_DB: prediction_app
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data:z
    restart: unless-stopped

volumes:
  db-data:
